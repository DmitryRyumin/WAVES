[App]
TITLE = "WAVES"
VERSION = "1.0.0"
CSS_PATH = "app.css"


[Server]
NAME = "127.0.0.1"
PORT = 7860


[Logging]
LEVEL = "INFO"
FORMAT = "[%(levelname)s] %(name)s: %(message)s"


[AudioValidation]
MIN_DURATION_SECONDS = 0.1
MAX_DURATION_SECONDS = 300.0


[AudioDecoding]
TARGET_SAMPLE_RATE = 16000
TARGET_NUM_CHANNELS = 1


[AudioPreprocessing]
ENABLE_NORMALIZATION = true
NORMALIZATION_EPS = 1e-8


[Inference]
DEVICE = "auto"
ENABLE_AMP = true
AMP_DTYPE = "bfloat16"
WINDOW_SECONDS = 2.0
HOP_SECONDS = 1.0


[AudioPostprocessing]
MATCH_INPUT_RMS = true
RMS_EPS = 1e-6
ENABLE_PEAK_LIMITING = true
PEAK_LIMIT = 0.99


[Model]
ROOT = "models"
WEIGHTS_FILENAME = "model.safetensors"
CONFIG_FILENAME = "config.yaml"
DEFAULT_MODEL = "waves"
CACHE_MODELS = true


[MoERouting]
ENABLE = true
PROCESS_FULL_AUDIO = true
SHOW_EXPERT_OCCUPANCY = true
SHOW_EXPERT_LOAD_BY_FREQUENCY = true
SHOW_LAYER_ROUTING = true
SHOW_EXPERT_LOAD_OVER_TIME = true


[Visualization]
SPECTROGRAM_N_FFT = 2048
SPECTROGRAM_NUM_MELS = 80
SPECTROGRAM_MAX_FREQUENCY = 8000
SPECTROGRAM_HOP_LENGTH = 512
SPECTROGRAM_TOP_DB = 80.0
SPECTROGRAM_MAX_TIME_BINS = 2000
SPECTROGRAM_DELTA_MAX_DB = 20.0
SPECTROGRAM_COLORSCALE = "Cividis"

SHOW_SPECTROGRAM = true
SHOW_ROUTING = true


[StaticPaths]
EXAMPLES = "examples"
IMAGES = "static/images"


[Images]
LANGUAGES = [ "flags/en.svg", "flags/ru.svg" ]


[Examples]
AUDIO = [
    "p226_001.wav",
    "p226_002.wav",
    "p226_003.wav",
    "p226_004.wav",
    "p226_005.wav",
    "p226_006.wav",
    "p226_007.wav",
    "p226_008.wav",
]


[Languages]
CHOICES = [ "English", "Русский" ]
DEFAULT = "English"


[Tabs]
APP = [ "⭐ Application", "⭐ Приложение" ]
SETTINGS = [ "⚙️ Settings", "⚙️ Настройки" ]
ABOUT_APP = [ "💡 About", "💡 О WAVES" ]
AUTHORS = [ "🎭 About the Authors", "🎭 Об авторах" ]
REQUIREMENTS = [ "📋 Requirements", "📋 Системные требования" ]


[TabCreators]
APP = "create_application_tab"
SETTINGS = "create_settings_tab"
ABOUT_APP = "create_about_app_tab"
AUTHORS = "create_authors_tab"
REQUIREMENTS = "create_requirements_tab"


[TabStates]
APP = "enabled"
SETTINGS = "hidden"
ABOUT_APP = "disabled"
AUTHORS = "disabled"
REQUIREMENTS = "disabled"


