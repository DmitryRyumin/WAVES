name: Deploy to Hugging Face

on:
    push:
        branches:
            - main
        paths:
            - ".dockerignore"
            - "Dockerfile"
            - "LICENSE"
            - "app.py"
            - "app.css"
            - "config.toml"
            - "pyproject.toml"
            - "uv.lock"
            - "waves/**"
            - "static/**"
            - "models/waves/config.yaml"
            - "deploy/huggingface/README.md"
            - ".github/workflows/deploy-huggingface.yml"

    workflow_dispatch:

concurrency:
    group: deploy-hugging-face-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    HF_REPO_ID: DmitryRyumin/WAVES
    HF_REPO_TYPE: space
    DEPLOY_DIR: .huggingface-deploy

jobs:
    deploy:
        name: Deploy Space
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14"

            - name: Install Hugging Face CLI
              run: |
                  python -m pip install \
                    --disable-pip-version-check \
                    "huggingface-hub==1.28.0"

            - name: Validate Hugging Face assets
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail

                  python <<'PY'
                  import os
                  from pathlib import Path
                  import tomllib

                  from huggingface_hub import HfApi


                  config_path = Path("config.toml")

                  with config_path.open("rb") as file:
                      config = tomllib.load(file)

                  model = config["Model"]
                  static_paths = config["StaticPaths"]
                  examples = config["Examples"]

                  model_path = (
                      Path(model["ROOT"])
                      / model["DEFAULT_MODEL"]
                      / model["WEIGHTS_FILENAME"]
                  )

                  examples_root = Path(static_paths["EXAMPLES"])

                  required_files = {
                      model_path.as_posix(),
                      *(
                          (examples_root / filename).as_posix()
                          for filename in examples["AUDIO"]
                      ),
                  }

                  api = HfApi(token=os.environ["HF_TOKEN"])

                  remote_files = set(
                      api.list_repo_files(
                          repo_id=os.environ["HF_REPO_ID"],
                          repo_type=os.environ["HF_REPO_TYPE"],
                      )
                  )

                  missing_files = sorted(required_files - remote_files)

                  if missing_files:
                      formatted = "\n".join(
                          f"  - {path}"
                          for path in missing_files
                      )

                      raise SystemExit(
                          "Required Hugging Face-only assets are missing:\n"
                          f"{formatted}"
                      )

                  print("Required Hugging Face-only assets are present.")
                  PY

            - name: Prepare deployment
              shell: bash
              run: |
                  set -euo pipefail

                  rm -rf "${DEPLOY_DIR}"

                  mkdir -p \
                    "${DEPLOY_DIR}" \
                    "${DEPLOY_DIR}/models/waves"

                  cp .dockerignore "${DEPLOY_DIR}/"
                  cp Dockerfile "${DEPLOY_DIR}/"
                  cp LICENSE "${DEPLOY_DIR}/"
                  cp app.py "${DEPLOY_DIR}/"
                  cp app.css "${DEPLOY_DIR}/"
                  cp config.toml "${DEPLOY_DIR}/"
                  cp pyproject.toml "${DEPLOY_DIR}/"
                  cp uv.lock "${DEPLOY_DIR}/"

                  cp -R waves "${DEPLOY_DIR}/waves"
                  cp -R static "${DEPLOY_DIR}/static"

                  cp \
                    models/waves/config.yaml \
                    "${DEPLOY_DIR}/models/waves/config.yaml"

                  cp \
                    deploy/huggingface/README.md \
                    "${DEPLOY_DIR}/README.md"

                  echo "Deployment contents:"
                  find "${DEPLOY_DIR}" -type f -print | sort

            - name: Deploy to Hugging Face
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail

                  hf upload \
                    "${HF_REPO_ID}" \
                    "${DEPLOY_DIR}" \
                    . \
                    --repo-type "${HF_REPO_TYPE}" \
                    --exclude ".gitattributes" \
                    --exclude "examples/*" \
                    --exclude "models/waves/model.safetensors" \
                    --delete "*" \
                    --token "${HF_TOKEN}" \
                    --commit-message "Deploy from GitHub ${GITHUB_SHA::7}"
